<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider — Quebra-Cabeça</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Oswald:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── THEMES ─────────────────────────────────────────────────────── */
[data-theme="dark"] {
  --bg-page:     #07091a;
  --bg-board:    rgba(255,255,255,.035);
  --board-bdr:   rgba(255,215,0,.18);
  --board-glow:  rgba(255,215,0,.07);
  --t1:          #ffffff;
  --t2:          rgba(255,255,255,.5);
  --t3:          rgba(255,255,255,.22);
  --panel-bg:    rgba(255,255,255,.055);
  --panel-bdr:   rgba(255,255,255,.1);
  --cbtn-bg:     rgba(255,255,255,.06);
  --cbtn-bdr:    rgba(255,255,255,.1);
  --cbtn-act:    rgba(255,215,0,.18);
  --cbtn-adbdr:  rgba(255,215,0,.55);
  --modal-a:     #10103a;
  --modal-b:     #1c1558;
  --modal-bdr:   rgba(255,215,0,.3);
  --overlay:     rgba(0,0,0,.92);
  --empty-bdr:   rgba(255,215,0,.13);
}
[data-theme="light"] {
  --bg-page:     #eef1f7;
  --bg-board:    rgba(255,255,255,.75);
  --board-bdr:   rgba(160,110,0,.2);
  --board-glow:  rgba(160,110,0,.04);
  --t1:          #1a1a2e;
  --t2:          rgba(20,20,50,.55);
  --t3:          rgba(20,20,50,.3);
  --panel-bg:    rgba(255,255,255,.6);
  --panel-bdr:   rgba(0,0,0,.1);
  --cbtn-bg:     rgba(0,0,0,.04);
  --cbtn-bdr:    rgba(0,0,0,.1);
  --cbtn-act:    rgba(160,110,0,.12);
  --cbtn-adbdr:  rgba(140,95,0,.45);
  --modal-a:     #dde4f5;
  --modal-b:     #c5cfe8;
  --modal-bdr:   rgba(100,80,0,.22);
  --overlay:     rgba(0,0,0,.72);
  --empty-bdr:   rgba(120,80,0,.15);
}
[data-theme="gray"] {
  --bg-page:     #1e1e24;
  --bg-board:    rgba(255,255,255,.04);
  --board-bdr:   rgba(180,180,200,.14);
  --board-glow:  rgba(180,180,200,.03);
  --t1:          #e2e2e8;
  --t2:          rgba(220,220,240,.5);
  --t3:          rgba(220,220,240,.25);
  --panel-bg:    rgba(255,255,255,.055);
  --panel-bdr:   rgba(255,255,255,.09);
  --cbtn-bg:     rgba(255,255,255,.06);
  --cbtn-bdr:    rgba(255,255,255,.1);
  --cbtn-act:    rgba(180,180,220,.14);
  --cbtn-adbdr:  rgba(180,180,230,.48);
  --modal-a:     #16161e;
  --modal-b:     #24242e;
  --modal-bdr:   rgba(200,200,230,.18);
  --overlay:     rgba(0,0,0,.9);
  --empty-bdr:   rgba(200,200,220,.1);
}

/* ── BASE ────────────────────────────────────────────────────────── */
body {
  background: var(--bg-page);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 14px 48px;
  font-family: 'Nunito', sans-serif;
  color: var(--t1);
  transition: background .28s ease, color .28s ease;
}

/* ── LOGO ──────────────────────────────────────────────────────────── */
.logo-wrap { display:flex; align-items:center; gap:12px; margin-bottom:3px; }

.logo-icon {
  width: 44px; height: 44px;
  border: 3px solid #ffd700;
  border-radius: 9px;
  position: relative;
  flex-shrink: 0;
}
.logo-icon::before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  background: #ffd700;
  border-radius: 3px;
  animation: sq 2.2s ease-in-out infinite;
}
@keyframes sq {
  0%   { top:4px;  left:4px; }
  25%  { top:4px;  left:22px; }
  50%  { top:22px; left:22px; }
  75%  { top:22px; left:4px; }
  100% { top:4px;  left:4px; }
}

h1 {
  font-family: 'Boogaloo', cursive;
  font-size: clamp(2rem, 8vw, 3.4rem);
  color: #ffd700;
  text-shadow: 3px 3px 0 #7a4800;
  letter-spacing: 5px;
  line-height: 1;
}

.subtitle {
  font-size: .7rem;
  letter-spacing: 3px;
  color: var(--t3);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 15px;
}

/* ── PANELS ─────────────────────────────────────────────────────────── */
.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-bdr);
  border-radius: 15px;
  padding: 12px 14px;
  margin-bottom: 10px;
  width: 100%;
  max-width: 440px;
  transition: background .28s, border-color .28s;
}

.plabel {
  font-size: .65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--t3);
  margin-bottom: 9px;
  font-weight: 800;
}

/* ── CONTROL BUTTONS ─────────────────────────────────────────────── */
.bgrp { display:flex; flex-wrap:wrap; gap:6px; }

.gb {
  padding: 7px 13px;
  background: var(--cbtn-bg);
  border: 1px solid var(--cbtn-bdr);
  border-radius: 8px;
  color: var(--t2);
  font-family: 'Nunito', sans-serif;
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .14s, border-color .14s, color .14s;
  white-space: nowrap;
}
.gb:hover { background: var(--cbtn-act); color: var(--t1); }
.gb.on {
  background: var(--cbtn-act);
  border-color: var(--cbtn-adbdr);
  color: var(--t1);
}

/* divider inside btn group */
.gdiv {
  width: 1px;
  background: var(--panel-bdr);
  align-self: stretch;
  margin: 0 3px;
}

/* ── STATS ROW ───────────────────────────────────────────────────── */
.stats-row {
  display:flex; flex-wrap:wrap; gap:10px;
  align-items:center; justify-content:center;
  margin-bottom: 13px;
}
.stat {
  background: var(--panel-bg);
  border: 1px solid var(--panel-bdr);
  border-radius: 11px;
  padding: 7px 16px;
  font-size: .84rem;
  color: var(--t2);
  display: flex; align-items: center; gap: 6px;
}
.stat .num {
  font-family: 'Oswald', sans-serif;
  font-size: 1.5rem;
  color: #ffd700;
  line-height: 1;
  min-width: 26px;
  text-align: center;
}

/* ── ACTION BUTTONS ──────────────────────────────────────────────── */
.abtn {
  padding: 8px 16px;
  border: none; border-radius: 9px;
  font-family: 'Nunito', sans-serif;
  font-size: .85rem; font-weight: 800;
  cursor: pointer;
  transition: filter .12s, transform .12s;
  white-space: nowrap;
}
.abtn:hover  { filter: brightness(1.12); }
.abtn:active { transform: scale(.95); }
.a-shuffle { background: linear-gradient(135deg,#f7971e,#ffd200); color: #3d1500; }
.a-load    { background: linear-gradient(135deg,#11998e,#38ef7d); color: #002e1e; }
.a-peek    {
  background: linear-gradient(135deg,#4e54c8,#8f94fb);
  color: #fff;
  user-select: none; -webkit-user-select: none; touch-action: none;
}

/* ── SWATCHES ────────────────────────────────────────────────────── */
.swatch-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

.sw {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .14s, border-color .14s, box-shadow .14s;
  flex-shrink: 0;
}
.sw:hover { transform: scale(1.15); }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }

.sw-multi {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  font-size: .6rem; font-weight: 800;
  font-family: 'Nunito', sans-serif;
  display: flex; align-items: center; justify-content: center;
  background: conic-gradient(#ff6b6b 0 60deg,#ffd700 60deg 120deg,#4caf50 120deg 180deg,#2196f3 180deg 240deg,#9c27b0 240deg 300deg,#ff4081 300deg 360deg);
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.6);
  transition: transform .14s, border-color .14s, box-shadow .14s;
  flex-shrink: 0;
}
.sw-multi:hover { transform: scale(1.15); }
.sw-multi.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }

/* ── BOARD ───────────────────────────────────────────────────────── */
#board {
  position: relative;
  background: var(--bg-board);
  border-radius: 18px;
  border: 1.5px solid var(--board-bdr);
  box-shadow: 0 0 55px var(--board-glow), 0 18px 40px rgba(0,0,0,.32);
  flex-shrink: 0;
  transition: background .28s, border-color .28s;
}

/* ── TILES ───────────────────────────────────────────────────────── */
.tile {
  position: absolute;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Oswald', sans-serif; font-weight: 700;
  user-select: none;
  cursor: pointer;
  will-change: top, left;
  background: linear-gradient(145deg,#ffe566,#ffb300);
  color: #3d1500;
  box-shadow: 0 4px 0 #8a5900, 0 6px 14px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35);
  border: 1px solid rgba(255,150,0,.3);
  transition: top .17s cubic-bezier(.25,.46,.45,.94), left .17s cubic-bezier(.25,.46,.45,.94), filter .1s, transform .1s;
}
.tile:hover  { filter: brightness(1.1); transform: scale(1.04); z-index: 2; }
.tile:active { transform: scale(.96); }

.tile.adj {
  box-shadow: 0 4px 0 #8a5900, 0 6px 14px rgba(0,0,0,.28),
              0 0 0 2px rgba(255,240,60,.55), inset 0 1px 0 rgba(255,255,255,.35);
}

.tile.empty {
  background: transparent !important;
  box-shadow: none !important;
  border: 1.5px dashed var(--empty-bdr) !important;
  cursor: default !important;
  pointer-events: none;
}
.tile.empty:hover { filter: none !important; transform: none !important; }

/* Image filters */
.img-sepia       { filter: sepia(1); }
.img-gray        { filter: grayscale(1); }
.img-sepia:hover { filter: sepia(1) brightness(1.1); }
.img-gray:hover  { filter: grayscale(1) brightness(1.1); }
.img-sepia.adj   { filter: sepia(1) !important; }
.img-gray.adj    { filter: grayscale(1) !important; }

/* ── HINT ───────────────────────────────────────────────────────── */
.hint {
  margin-top: 11px;
  font-size: .68rem;
  color: var(--t3);
  text-align: center;
  max-width: 380px;
  line-height: 1.65;
}

/* ── WIN MODAL ───────────────────────────────────────────────────── */
.mbg {
  position: fixed; inset: 0;
  background: var(--overlay);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
  padding: 20px;
}
.mbg.show { opacity: 1; pointer-events: all; }

.modal {
  background: linear-gradient(160deg, var(--modal-a), var(--modal-b));
  border: 1.5px solid var(--modal-bdr);
  border-radius: 24px;
  padding: 34px 26px;
  max-width: 360px; width: 100%;
  text-align: center;
  transform: scale(.8) translateY(22px);
  transition: transform .42s cubic-bezier(.34,1.56,.64,1);
}
.mbg.show .modal { transform: scale(1) translateY(0); }

.modal-title {
  font-family: 'Boogaloo', cursive;
  font-size: 2.5rem;
  color: #ffd700;
  text-shadow: 0 0 22px rgba(255,215,0,.4);
  margin-bottom: 3px;
}
.modal-sub { color: var(--t2); font-size: .83rem; margin-bottom: 18px; }

.modal-vis {
  width: 196px; height: 196px;
  margin: 0 auto 18px;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid var(--modal-bdr);
}
.modal-vis img { width:100%; height:100%; object-fit:cover; display:block; }

.mini-grid {
  width: 196px; height: 196px;
  margin: 0 auto 18px;
  border-radius: 12px;
  border: 2px solid var(--modal-bdr);
  display: grid;
  padding: 8px; gap: 4px;
}
.mc { border-radius: 5px; display:flex; align-items:center; justify-content:center;
      font-family:'Oswald',sans-serif; font-size:.78rem; font-weight:700; }
.mc.blank { background: transparent; }

.modal-score { font-size:.92rem; color:var(--t2); margin-bottom:3px; }
.modal-score strong { font-family:'Oswald',sans-serif; font-size:1.85rem; color:#ffd700; }
.modal-rate  { font-size:.85rem; color:var(--t2); min-height:19px; margin-bottom:22px; }

.btn-again {
  padding: 12px 28px;
  background: linear-gradient(135deg,#ffd700,#ffaa00);
  color: #3d1500; border: none; border-radius: 11px;
  font-family: 'Nunito', sans-serif; font-size: .96rem; font-weight: 800;
  cursor: pointer; transition: filter .14s, transform .14s;
}
.btn-again:hover  { filter: brightness(1.1); transform: scale(1.04); }
.btn-again:active { transform: scale(.97); }

/* ── PEEK MODAL ──────────────────────────────────────────────────── */
.peek-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.88);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 900; opacity: 0; pointer-events: none;
  transition: opacity .18s ease;
  gap: 14px; padding: 30px;
}
.peek-bg.show { opacity: 1; }

.peek-img {
  max-width: min(78vw, 380px);
  max-height: min(75vh, 380px);
  border-radius: 14px;
  border: 2px solid rgba(255,215,0,.5);
  box-shadow: 0 0 50px rgba(255,215,0,.18);
  object-fit: cover;
  display: block;
}
.peek-tag {
  font-size: .72rem;
  color: rgba(255,255,255,.38);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ── CONFETTI ─────────────────────────────────────────────────────── */
.conf-wrap { position:fixed; inset:0; pointer-events:none; z-index:998; overflow:hidden; }
.bit { position:absolute; animation:rain linear forwards; }
@keyframes rain {
  0%   { transform: translateY(-20px) rotate(0deg); }
  100% { transform: translateY(110vh)  rotate(620deg); }
}

#fileIn { display:none; }

@media (max-width:460px) {
  h1 { font-size: 1.9rem; letter-spacing: 3px; }
  .panel { padding: 10px 12px; }
}
</style>
</head>
<body>

<!-- LOGO -->
<div class="logo-wrap">
  <div class="logo-icon" aria-hidden="true"></div>
  <h1>Slider</h1>
</div>
<div class="subtitle">O quebra-cabeça deslizante clássico</div>

<!-- PANEL 1: Tema + Dificuldade -->
<div class="panel">
  <div class="plabel">Tema &amp; Dificuldade</div>
  <div class="bgrp">
    <button class="gb on" data-t="dark"  onclick="setTheme('dark')">🌙 Escuro</button>
    <button class="gb"    data-t="light" onclick="setTheme('light')">☀️ Claro</button>
    <button class="gb"    data-t="gray"  onclick="setTheme('gray')">⬜ Cinza</button>
    <span class="gdiv"></span>
    <button class="gb on" data-s="4" onclick="setSize(4)">Normal 4×4</button>
    <button class="gb"    data-s="3" onclick="setSize(3)">Fácil 3×3</button>
  </div>
</div>

<!-- PANEL 2: Modo de Jogo -->
<div class="panel">
  <div class="plabel">Modo de Jogo</div>
  <div class="bgrp" style="margin-bottom:12px;">
    <button class="gb on" data-m="numbers" onclick="setMode('numbers')">🔢 Números</button>
    <button class="gb"    data-m="letters" onclick="setMode('letters')">🔤 Letras</button>
    <button class="gb"    data-m="image"   onclick="setMode('image')">🖼️ Imagem</button>
  </div>

  <!-- Cores das peças (números / letras) -->
  <div id="colorPanel">
    <div class="plabel" style="margin-bottom:8px;">Cor das Peças</div>
    <div class="swatch-row" id="swatchRow"></div>
  </div>

  <!-- Controles de imagem -->
  <div id="imgPanel" style="display:none;">
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">
      <button class="abtn a-load" onclick="document.getElementById('fileIn').click()">📂 Carregar Imagem</button>
      <button class="abtn a-peek" id="btnPeek">👁️ Espiar</button>
    </div>
    <div class="plabel" style="margin-bottom:8px;">Filtro da Imagem</div>
    <div class="bgrp">
      <button class="gb on" data-f="none"  onclick="setFilter('none')">🎨 Normal</button>
      <button class="gb"    data-f="sepia" onclick="setFilter('sepia')">🟤 Sépia</button>
      <button class="gb"    data-f="gray"  onclick="setFilter('gray')">⬜ P&amp;B</button>
    </div>
  </div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat">Movimentos&nbsp;<span class="num" id="mc">0</span></div>
  <button class="abtn a-shuffle" onclick="shuffle()">🔀 Embaralhar</button>
</div>

<!-- BOARD -->
<div id="board"></div>

<div class="hint">
  Clique nas peças adjacentes ao espaço vazio para movê-las.<br>
  Teclas ↑↓←→ também funcionam.
</div>

<input type="file" id="fileIn" accept="image/*" onchange="onFileLoad(event)">

<!-- WIN MODAL -->
<div class="mbg" id="winBg">
  <div class="modal">
    <div class="modal-title">🎉 Parabéns!</div>
    <div class="modal-sub">Você resolveu o Slider!</div>
    <div id="mVis"></div>
    <div class="modal-score">Movimentos: <strong id="mMc">0</strong></div>
    <div class="modal-rate" id="mRate"></div>
    <button class="btn-again" onclick="closeWin()">🔀 Jogar Novamente</button>
  </div>
</div>

<!-- PEEK MODAL -->
<div class="peek-bg" id="peekBg">
  <img class="peek-img" id="peekImg" src="" alt="Imagem completa">
  <div class="peek-tag">Solte para fechar</div>
</div>

<!-- CONFETTI -->
<div class="conf-wrap" id="confWrap"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────
const LETTERS = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
const CONF    = ['#ffd700','#ff6b35','#4e54c8','#11998e','#f7c59f','#ff69b4','#38ef7d','#00bfff','#ff4081','#76ff03'];

const SWATCHES = [
  { id:'gold',   label:'Ouro',     g:'linear-gradient(135deg,#ffe566,#ffb300)', bg:'linear-gradient(145deg,#ffe566,#ffb300)', sh:'#8a5900', tx:'#3d1500' },
  { id:'red',    label:'Vermelho', g:'linear-gradient(135deg,#ff6b6b,#c0392b)', bg:'linear-gradient(145deg,#ff6b6b,#c0392b)', sh:'#7a0000', tx:'#fff' },
  { id:'blue',   label:'Azul',     g:'linear-gradient(135deg,#74b9ff,#0984e3)', bg:'linear-gradient(145deg,#74b9ff,#0984e3)', sh:'#035280', tx:'#fff' },
  { id:'green',  label:'Verde',    g:'linear-gradient(135deg,#55efc4,#00b894)', bg:'linear-gradient(145deg,#55efc4,#00b894)', sh:'#005533', tx:'#002e1e' },
  { id:'purple', label:'Roxo',     g:'linear-gradient(135deg,#a29bfe,#6c5ce7)', bg:'linear-gradient(145deg,#a29bfe,#6c5ce7)', sh:'#3a1da0', tx:'#fff' },
  { id:'teal',   label:'Ciano',    g:'linear-gradient(135deg,#81ecec,#00cec9)', bg:'linear-gradient(145deg,#81ecec,#00cec9)', sh:'#006060', tx:'#003c3c' },
  { id:'orange', label:'Laranja',  g:'linear-gradient(135deg,#fdcb6e,#e17055)', bg:'linear-gradient(145deg,#fdcb6e,#e17055)', sh:'#8a2400', tx:'#3d1500' },
];

const MULTICOLS = [
  { bg:'linear-gradient(145deg,#ff6b6b,#c0392b)', sh:'#7a0000', tx:'#fff' },
  { bg:'linear-gradient(145deg,#ffe566,#ffb300)', sh:'#8a5900', tx:'#3d1500' },
  { bg:'linear-gradient(145deg,#74b9ff,#0984e3)', sh:'#035280', tx:'#fff' },
  { bg:'linear-gradient(145deg,#55efc4,#00b894)', sh:'#005533', tx:'#002e1e' },
  { bg:'linear-gradient(145deg,#a29bfe,#6c5ce7)', sh:'#3a1da0', tx:'#fff' },
  { bg:'linear-gradient(145deg,#fd79a8,#e84393)', sh:'#7a0040', tx:'#fff' },
  { bg:'linear-gradient(145deg,#81ecec,#00cec9)', sh:'#006060', tx:'#003c3c' },
  { bg:'linear-gradient(145deg,#fdcb6e,#e17055)', sh:'#8a2400', tx:'#3d1500' },
  { bg:'linear-gradient(145deg,#dfe6e9,#b2bec3)', sh:'#6c7f87', tx:'#2d3436' },
  { bg:'linear-gradient(145deg,#00b894,#006644)', sh:'#003322', tx:'#fff' },
  { bg:'linear-gradient(145deg,#6c5ce7,#4834d4)', sh:'#1a0080', tx:'#fff' },
  { bg:'linear-gradient(145deg,#e17055,#8b1a00)', sh:'#3d0000', tx:'#fff' },
  { bg:'linear-gradient(145deg,#0984e3,#0052cc)', sh:'#002a66', tx:'#fff' },
  { bg:'linear-gradient(145deg,#00cec9,#006666)', sh:'#003333', tx:'#fff' },
  { bg:'linear-gradient(145deg,#ff7675,#d63031)', sh:'#6b0000', tx:'#fff' },
];

// ── STATE ─────────────────────────────────────────────────────────────
let N           = 4;
let tiles       = [];
let moves       = 0;
let won         = false;
let contentMode = 'numbers';
let tileColorId = 'gold';
let imgFilter   = 'none';
let imgURL      = null;
let T, G;

// ── SIZES ─────────────────────────────────────────────────────────────
function computeSizes() {
  const maxW = Math.min(385, window.innerWidth - 36);
  G = 5;
  T = Math.floor((maxW - (N + 1) * G) / N);
  const px = N * T + (N + 1) * G;
  const board = document.getElementById('board');
  board.style.width  = px + 'px';
  board.style.height = px + 'px';
}

// ── TILE STYLE ────────────────────────────────────────────────────────
function tileStyle(v) {
  if (tileColorId === 'multi') return MULTICOLS[(v - 1) % MULTICOLS.length];
  const sw = SWATCHES.find(s => s.id === tileColorId) || SWATCHES[0];
  return { bg: sw.bg, sh: sw.sh, tx: sw.tx };
}

// ── STATE HELPERS ─────────────────────────────────────────────────────
function mkSolved() {
  tiles = [];
  const tot = N * N;
  for (let i = 0; i < tot; i++)
    tiles.push({ v: i < tot - 1 ? i + 1 : 0, r: Math.floor(i / N), c: i % N });
}

function emptyTile()     { return tiles.find(t => t.v === 0); }
function tilePos(r, c)   { return { top: r * (T + G) + G, left: c * (T + G) + G }; }

// ── SHUFFLE ────────────────────────────────────────────────────────────
function shuffle() {
  computeSizes();
  mkSolved();
  moves = 0; won = false;
  document.getElementById('mc').textContent = '0';

  const e = emptyTile();
  let pr = -1, pc = -1;
  const iters = N === 3 ? 220 : 360;

  for (let i = 0; i < iters; i++) {
    const ns = tiles.filter(t =>
      t.v !== 0 &&
      !(t.r === pr && t.c === pc) &&
      ((Math.abs(t.r - e.r) === 1 && t.c === e.c) ||
       (Math.abs(t.c - e.c) === 1 && t.r === e.r))
    );
    if (!ns.length) continue;
    const pick = ns[Math.floor(Math.random() * ns.length)];
    [pr, pc] = [e.r, e.c];
    [pick.r, pick.c, e.r, e.c] = [e.r, e.c, pick.r, pick.c];
  }

  buildDOM(); markAdj();
}

// ── BUILD DOM ──────────────────────────────────────────────────────────
function buildDOM() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const isImg  = contentMode === 'image' && imgURL;
  const fsize  = Math.max(16, Math.round(T * 0.28)) + 'px';

  tiles.forEach(t => {
    const el = document.createElement('div');
    el.id = 'T' + t.v;

    if (t.v === 0) {
      el.className = 'tile empty';
    } else {
      el.className = 'tile';
      if (isImg) {
        styleImgTile(el, t.v);
        if (imgFilter === 'sepia') el.classList.add('img-sepia');
        if (imgFilter === 'gray')  el.classList.add('img-gray');
      } else {
        const st = tileStyle(t.v);
        el.style.background = st.bg;
        el.style.color      = st.tx;
        el.style.boxShadow  = `0 4px 0 ${st.sh},0 6px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35)`;
        el.style.fontSize   = fsize;
        el.textContent = contentMode === 'letters' ? (LETTERS[t.v - 1] || t.v) : t.v;
      }
      el.addEventListener('click', () => moveTile(t));
    }

    el.style.width  = T + 'px';
    el.style.height = T + 'px';
    const p = tilePos(t.r, t.c);
    el.style.top  = p.top  + 'px';
    el.style.left = p.left + 'px';
    board.appendChild(el);
  });
}

function styleImgTile(el, v) {
  const row = Math.floor((v - 1) / N);
  const col = (v - 1) % N;
  el.style.backgroundImage    = `url(${imgURL})`;
  el.style.backgroundSize     = `${N * T}px ${N * T}px`;
  el.style.backgroundPosition = `-${col * T}px -${row * T}px`;
  el.style.backgroundRepeat   = 'no-repeat';
  el.style.boxShadow          = '0 4px 0 #444,0 6px 14px rgba(0,0,0,.28)';
  el.style.border             = '1px solid rgba(255,255,255,.12)';
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render() {
  tiles.forEach(t => {
    const el = document.getElementById('T' + t.v);
    if (!el) return;
    const p = tilePos(t.r, t.c);
    el.style.top  = p.top  + 'px';
    el.style.left = p.left + 'px';
  });
  markAdj();
}

function markAdj() {
  const e = emptyTile();
  tiles.forEach(t => {
    if (!t.v) return;
    const el = document.getElementById('T' + t.v);
    if (!el) return;
    const adj =
      (Math.abs(t.r - e.r) === 1 && t.c === e.c) ||
      (Math.abs(t.c - e.c) === 1 && t.r === e.r);
    el.classList.toggle('adj', adj);
  });
}

// ── MOVE ──────────────────────────────────────────────────────────────
function moveTile(tile) {
  if (won || !tile.v) return;
  const e = emptyTile();
  const ok =
    (Math.abs(tile.r - e.r) === 1 && tile.c === e.c) ||
    (Math.abs(tile.c - e.c) === 1 && tile.r === e.r);
  if (!ok) return;

  [tile.r, tile.c, e.r, e.c] = [e.r, e.c, tile.r, tile.c];
  moves++;
  document.getElementById('mc').textContent = moves;
  render();
  if (checkWin()) { won = true; setTimeout(showWin, 490); }
}

function moveDir(dr, dc) {
  const e = emptyTile();
  const t = tiles.find(t => t.r === e.r + dr && t.c === e.c + dc);
  if (t) moveTile(t);
}

function checkWin() {
  return tiles.every(t =>
    t.v === 0
      ? t.r === N - 1 && t.c === N - 1
      : t.r === Math.floor((t.v - 1) / N) && t.c === (t.v - 1) % N
  );
}

// ── UI CONTROLLERS ────────────────────────────────────────────────────
function setTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  document.querySelectorAll('[data-t]').forEach(b =>
    b.classList.toggle('on', b.dataset.t === th));
}

function setSize(n) {
  N = n;
  document.querySelectorAll('[data-s]').forEach(b =>
    b.classList.toggle('on', +b.dataset.s === n));
  shuffle();
}

function setMode(m) {
  contentMode = m;
  document.querySelectorAll('[data-m]').forEach(b =>
    b.classList.toggle('on', b.dataset.m === m));
  document.getElementById('colorPanel').style.display = m === 'image' ? 'none' : 'block';
  document.getElementById('imgPanel').style.display   = m === 'image' ? 'block' : 'none';
  if (m === 'image' && !imgURL) { document.getElementById('fileIn').click(); }
  else { buildDOM(); markAdj(); }
}

function setFilter(f) {
  imgFilter = f;
  document.querySelectorAll('[data-f]').forEach(b =>
    b.classList.toggle('on', b.dataset.f === f));
  buildDOM(); markAdj();
}

// ── SWATCHES ──────────────────────────────────────────────────────────
function buildSwatches() {
  const row = document.getElementById('swatchRow');
  row.innerHTML = '';

  SWATCHES.forEach(sw => {
    const btn = document.createElement('button');
    btn.className = 'sw' + (sw.id === tileColorId ? ' on' : '');
    btn.title = sw.label;
    btn.style.background = sw.g;
    btn.dataset.sw = sw.id;
    btn.addEventListener('click', () => { tileColorId = sw.id; swActive(); buildDOM(); markAdj(); });
    row.appendChild(btn);
  });

  const multi = document.createElement('button');
  multi.className = 'sw-multi' + (tileColorId === 'multi' ? ' on' : '');
  multi.title = 'Multicor';
  multi.textContent = 'M';
  multi.dataset.sw = 'multi';
  multi.addEventListener('click', () => { tileColorId = 'multi'; swActive(); buildDOM(); markAdj(); });
  row.appendChild(multi);
}

function swActive() {
  document.querySelectorAll('[data-sw]').forEach(el =>
    el.classList.toggle('on', el.dataset.sw === tileColorId));
}

// ── IMAGE ──────────────────────────────────────────────────────────────
function onFileLoad(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    imgURL = e.target.result;
    document.getElementById('peekImg').src = imgURL;
    contentMode = 'image';
    document.querySelectorAll('[data-m]').forEach(b =>
      b.classList.toggle('on', b.dataset.m === 'image'));
    document.getElementById('colorPanel').style.display = 'none';
    document.getElementById('imgPanel').style.display   = 'block';
    buildDOM(); markAdj();
  };
  reader.readAsDataURL(file);
  evt.target.value = '';
}

// ── PEEK ──────────────────────────────────────────────────────────────
function showPeek() { if (imgURL) document.getElementById('peekBg').classList.add('show'); }
function hidePeek() { document.getElementById('peekBg').classList.remove('show'); }

// ── WIN MODAL ─────────────────────────────────────────────────────────
function showWin() {
  document.getElementById('mMc').textContent = moves;

  const base = N === 3 ? 25 : 55;
  const table = [
    [base,       '🌟🌟🌟 Mestre lendário! Performance incrível!'],
    [base * 1.8, '⭐⭐⭐ Impressionante! Você é muito bom!'],
    [base * 3,   '⭐⭐ Muito bem! Boa resolução!'],
    [base * 5,   '⭐ Conseguiu! Continue treinando!'],
    [Infinity,   '💪 Persistência é tudo! Chegou lá!'],
  ];
  document.getElementById('mRate').textContent =
    table.find(([lim]) => moves <= lim)[1];

  const vis = document.getElementById('mVis');
  vis.innerHTML = '';

  if (contentMode === 'image' && imgURL) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-vis';
    const img = document.createElement('img');
    img.src = imgURL; img.alt = 'Imagem completa';
    if (imgFilter === 'sepia') img.style.filter = 'sepia(1)';
    if (imgFilter === 'gray')  img.style.filter = 'grayscale(1)';
    wrap.appendChild(img); vis.appendChild(wrap);
  } else {
    const grid = document.createElement('div');
    grid.className = 'mini-grid';
    grid.style.gridTemplateColumns = `repeat(${N},1fr)`;
    for (let i = 1; i <= N * N; i++) {
      const cell = document.createElement('div');
      if (i === N * N) {
        cell.className = 'mc blank';
      } else {
        cell.className = 'mc';
        const st = tileColorId === 'multi'
          ? MULTICOLS[(i - 1) % MULTICOLS.length]
          : (() => { const s = SWATCHES.find(s => s.id === tileColorId) || SWATCHES[0]; return {bg:s.g, tx:s.tx}; })();
        cell.style.background = st.bg || st.g;
        cell.style.color      = st.tx;
        cell.textContent = contentMode === 'letters' ? LETTERS[i - 1] : i;
      }
      grid.appendChild(cell);
    }
    vis.appendChild(grid);
  }

  document.getElementById('winBg').classList.add('show');
  launchConfetti();
}

function closeWin() {
  document.getElementById('winBg').classList.remove('show');
  clearConf();
  shuffle();
}

// ── CONFETTI ──────────────────────────────────────────────────────────
function launchConfetti() {
  const wrap = document.getElementById('confWrap');
  for (let i = 0; i < 130; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'bit';
      const sz = 6 + Math.random() * 10;
      el.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;` +
        `top:-20px;background:${CONF[Math.floor(Math.random()*CONF.length)]};` +
        `border-radius:${Math.random()>.5?'50%':'3px'};` +
        `animation-duration:${1.7+Math.random()*2.1}s;`;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 4300);
    }, i * 18);
  }
}

function clearConf() { document.getElementById('confWrap').innerHTML = ''; }

// ── PEEK EVENTS ────────────────────────────────────────────────────────
(function () {
  const btn = document.getElementById('btnPeek');
  btn.addEventListener('mousedown',    e => { e.preventDefault(); showPeek(); });
  btn.addEventListener('touchstart',   e => { e.preventDefault(); showPeek(); }, { passive: false });
  document.addEventListener('mouseup',     hidePeek);
  document.addEventListener('touchend',    hidePeek);
  document.addEventListener('touchcancel', hidePeek);
})();

// ── KEYBOARD ──────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowUp')    moveDir(1,  0);
  if (e.key === 'ArrowDown')  moveDir(-1, 0);
  if (e.key === 'ArrowLeft')  moveDir(0,  1);
  if (e.key === 'ArrowRight') moveDir(0, -1);
});

// ── RESIZE ────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { computeSizes(); buildDOM(); markAdj(); });

// ── INIT ──────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  buildSwatches();
  shuffle();
});
</script>
</body>
</html>
